spring:
  datasource:
    url: jdbc:h2:mem:sportal;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

server:
  servlet:
    session:
      cookie:
        secure: true

portal:
  base-url: ${PORTAL_BASE_URL:http://localhost:8090}
  brand-name: ${PORTAL_BRAND_NAME:Simbio}
