spring:
  datasource:
    url: jdbc:h2:mem:sportal;DB_CLOSE_DELAY=-1;NON_KEYWORDS=IDENTITY,ROLE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  flyway:
    enabled: false

server:
  servlet:
    session:
      cookie:
        secure: true

portal:
  base-url: ${PORTAL_BASE_URL:http://localhost:8090}
  brand-name: ${PORTAL_BRAND_NAME:Simbio}
  encryption:
    current-key-id: test-key
    keys: test-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  notification:
    from-address: portal@example.test
    retention: 30d
    worker:
      enabled: false
