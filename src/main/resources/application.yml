spring:
  application:
    name: portal
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  mail:
    host: ${PORTAL_SMTP_HOST:localhost}
    port: ${PORTAL_SMTP_PORT:1026}
    username: ${PORTAL_SMTP_USERNAME:}
    password: ${PORTAL_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${PORTAL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${PORTAL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8090
  servlet:
    session:
      cookie:
        name: SPORTAL_SESSION
        http-only: true
        same-site: lax

management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

portal:
  base-url: ${PORTAL_BASE_URL:http://localhost:8090}
  brand-name: ${PORTAL_BRAND_NAME:Simbio}
  messaging:
    polling:
      interval: ${PORTAL_MESSAGING_POLL_INTERVAL:15s}
      error-backoff: ${PORTAL_MESSAGING_POLL_ERROR_BACKOFF:60s}
    retention:
      trash-grace-period: ${PORTAL_MESSAGING_TRASH_GRACE_PERIOD:0s}
      purge-job-enabled: ${PORTAL_MESSAGING_PURGE_JOB_ENABLED:false}
      purge-cron: ${PORTAL_MESSAGING_PURGE_CRON:0 30 3 * * *}
    channels:
      whatsapp-e164-number: ${PORTAL_MESSAGING_WHATSAPP_E164_NUMBER:}
      whatsapp-text-es: ${PORTAL_MESSAGING_WHATSAPP_TEXT_ES:Hola, me gustaría ponerme en contacto.}
      whatsapp-text-en: ${PORTAL_MESSAGING_WHATSAPP_TEXT_EN:Hello, I would like to get in touch.}
      contact-email: ${PORTAL_MESSAGING_CONTACT_EMAIL:}
    contact:
      consent-text-es: ${PORTAL_MESSAGING_CONTACT_CONSENT_TEXT_ES:}
      consent-text-en: ${PORTAL_MESSAGING_CONTACT_CONSENT_TEXT_EN:}
      consent-version: ${PORTAL_MESSAGING_CONTACT_CONSENT_VERSION:0}
      max-attachments: 3
      max-attachment-bytes: 10485760
      max-total-attachment-bytes: 20971520
      max-audio-bytes: 10485760
  files:
    storage-root: ${PORTAL_FILE_STORAGE_ROOT:${java.io.tmpdir}/s-portal-files}
    clamav:
      enabled: ${PORTAL_CLAMAV_ENABLED:true}
      host: ${PORTAL_CLAMAV_HOST:localhost}
      port: ${PORTAL_CLAMAV_PORT:3310}
      timeout: ${PORTAL_CLAMAV_TIMEOUT:5000}
  error-tracking:
    inventory-path: ${PORTAL_ERROR_TRACKING_PATH:logs-error/error-inventory.json}
    max-entries: ${PORTAL_ERROR_TRACKING_MAX_ENTRIES:1000}
    max-file-bytes: ${PORTAL_ERROR_TRACKING_MAX_FILE_BYTES:5242880}
    max-field-length: ${PORTAL_ERROR_TRACKING_MAX_FIELD_LENGTH:2048}
    release: ${PORTAL_RELEASE:development}
  security:
    rate-limit:
      max-buckets: 10000
      ip-capacity: 30
      email-capacity: 5
      window: 1m
    anti-bot:
      proof-difficulty: 16
      ttl-seconds: 120
  encryption:
    current-key-id: ${PORTAL_ENCRYPTION_CURRENT_KEY_ID:}
    keys: ${PORTAL_ENCRYPTION_KEYS:}
  simbiosphere:
    client:
      enabled: ${PORTAL_SIMBIOSPHERE_CLIENT_ENABLED:false}
      base-url: ${PORTAL_SIMBIOSPHERE_BASE_URL:}
      key-id: ${PORTAL_SIMBIOSPHERE_KEY_ID:}
      secret: ${PORTAL_SIMBIOSPHERE_HMAC_SECRET:}
      connect-timeout: 3s
      read-timeout: 10s
      circuit-failure-threshold: 5
      circuit-open-duration: 30s
    worker:
      enabled: ${PORTAL_SIMBIOSPHERE_WORKER_ENABLED:false}
      poll-interval: ${PORTAL_SIMBIOSPHERE_POLL_INTERVAL:5s}
    fallback:
      enabled: ${PORTAL_SIMBIOSPHERE_FALLBACK_ENABLED:false}
      onboarding-url: ${PORTAL_SIMBIOSPHERE_ONBOARDING_URL:}
      allowed-hosts:
        - localhost
        - 127.0.0.1
        - orders.simbio.info
  request:
    sla:
      first-response-business-days: ${PORTAL_REQUEST_SLA_BUSINESS_DAYS:1} # Provisional; operations approval pending.
    quote-expiry:
      enabled: true
      cron: ${PORTAL_QUOTE_EXPIRY_CRON:0 0 * * * *}
  notification:
    from-address: ${PORTAL_SMTP_FROM:portal@localhost}
    retention: ${PORTAL_NOTIFICATION_RETENTION:30d}
    maximum-attempts: 6
    initial-backoff: 30s
    maximum-backoff: 1h
    claim-lease: 2m
    poll-interval: 5s
    purge-cron: "0 0 3 * * *"
    worker:
      enabled: true
