<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/backoffice :: layout(~{::main})}">
<main id="main-content" class="mx-auto w-full max-w-2xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.invitation.manage-title}">Invite a user</h1>
        <p th:if="${sent}" role="status" class="mt-4" th:text="#{identity.invitation.sent}">
            If eligible, an invitation will be sent.
        </p>
        <p th:if="${sent == false}" role="status" class="mt-4" th:text="#{identity.invitation.generic}">
            If eligible, an invitation will be sent.
        </p>
        <form method="post" th:action="@{/gestion/identidad/invitaciones}" class="mt-6 space-y-5">
            <div>
                <label for="invite-email" th:text="#{identity.invitation.email}">Email</label>
                <input id="invite-email" name="email" type="email" required maxlength="320" autocomplete="email"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            </div>
            <button type="submit" class="min-h-11 rounded bg-primary px-4 text-on-primary"
                    th:text="#{identity.invitation.send}">Send invitation</button>
        </form>
    </section>
</main>
</html>
