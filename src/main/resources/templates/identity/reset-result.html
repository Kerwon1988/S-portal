<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('identity.reset.title', ~{::main}, 'account')}">
<main id="main-content" class="mx-auto w-full max-w-xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.reset.result-title}">Password update</h1>
        <p role="status" class="mt-4"
           th:text="${success} ? #{identity.reset.success} : #{identity.reset.invalid}">
            The password could not be updated.
        </p>
    </section>
</main>
</html>
