<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('identity.verify.title', ~{::main}, 'account')}">
<main id="main-content" class="mx-auto w-full max-w-xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.verify.heading}">Verify your email</h1>
        <p class="mt-3 text-muted" th:text="#{identity.verify.description}">Confirm the address using this link.</p>
        <form method="post" th:action="@{/verificar-email}" class="mt-6">
            <input type="hidden" name="token" th:value="${token}">
            <button type="submit" class="min-h-11 rounded bg-primary px-4 text-on-primary"
                    th:text="#{identity.verify.submit}">Verify email</button>
        </form>
        <form method="post" th:action="@{/verificar-email/reenviar}" class="mt-8 space-y-3">
            <label for="verification-email" th:text="#{identity.verify.email}">Email</label>
            <input id="verification-email" name="email" type="email" maxlength="320" autocomplete="email"
                   class="min-h-11 w-full rounded border border-border bg-surface px-3">
            <button type="submit" class="min-h-11 rounded border border-border px-4"
                    th:text="#{identity.verify.resend}">Resend</button>
        </form>
    </section>
</main>
</html>
