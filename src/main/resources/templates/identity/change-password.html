<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('identity.password.title', ~{::main}, 'account')}">
<main id="main-content" class="mx-auto w-full max-w-xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.password.heading}">Change password</h1>
        <form method="post" th:action="@{/cuenta/seguridad/password}" class="mt-6 space-y-5">
            <div>
                <label for="current-password" th:text="#{identity.password.current}">Current password</label>
                <input id="current-password" name="currentPassword" type="password" required
                       autocomplete="current-password"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            </div>
            <div>
                <label for="changed-password" th:text="#{identity.reset.password}">New password</label>
                <input id="changed-password" name="newPassword" type="password" required minlength="12" maxlength="64"
                       autocomplete="new-password"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            </div>
            <button type="submit" class="min-h-11 rounded bg-primary px-4 text-on-primary"
                    th:text="#{identity.password.submit}">Change password</button>
        </form>
    </section>
</main>
</html>
