<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('identity.mfa.title', ~{::main}, 'account')}">
<main id="main-content" class="mx-auto w-full max-w-xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.mfa.recovery-heading}">Save your recovery codes</h1>
        <p role="alert" class="mt-3 text-danger" th:text="#{identity.mfa.recovery-warning}">
            These codes are shown once. Store them privately.
        </p>
        <ul class="mt-5 grid grid-cols-1 gap-2 sm:grid-cols-2">
            <li th:each="code : ${recoveryCodes}" class="rounded border border-border p-3 font-mono"
                th:text="${code}">recovery-code</li>
        </ul>
        <form method="post" th:action="@{/cuenta/seguridad/mfa/codigos-recuperacion}"
              class="mt-8 space-y-4">
            <label for="recovery-rotation-code" th:text="#{identity.mfa.rotate-label}">
                Enter a current authenticator code to replace these codes.
            </label>
            <input id="recovery-rotation-code" name="code" maxlength="6" pattern="[0-9]{6}" required
                   autocomplete="one-time-code" inputmode="numeric"
                   class="min-h-11 w-full rounded border border-border bg-surface px-3">
            <button type="submit" class="min-h-11 rounded border border-border px-4"
                    th:text="#{identity.mfa.rotate}">Replace recovery codes</button>
        </form>
        <a class="mt-6 inline-flex min-h-11 items-center text-primary" th:href="@{/cuenta/perfil}"
           th:text="#{identity.profile.title}">Profile</a>
    </section>
</main>
</html>
