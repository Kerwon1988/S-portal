<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('identity.verify.title', ~{::main}, 'account')}">
<main id="main-content" class="mx-auto w-full max-w-xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.verify.result-title}">Email verification</h1>
        <p role="status" class="mt-4"
           th:text="${generic} ? #{identity.verify.generic} : (${success} ? #{identity.verify.success} : #{identity.verify.invalid})">
            If the request is valid, the email has been verified.
        </p>
        <a class="mt-5 inline-flex min-h-11 items-center text-primary" th:href="@{/acceso}"
           th:text="#{identity.login.title}">Sign in</a>
    </section>
</main>
</html>
