<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('identity.mfa.title', ~{::main}, 'account')}">
<main id="main-content" class="mx-auto w-full max-w-xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.mfa.enroll-heading}">Set up an authenticator</h1>
        <p class="mt-3 text-muted" th:text="#{identity.mfa.enroll-description}">Add this key to your authenticator app.</p>
        <p class="mt-4 break-all rounded border border-border p-3" th:text="${enrollment.secret}">Secret</p>
        <p class="mt-3 break-all text-sm text-muted" th:text="${enrollment.provisioningUri}">Provisioning URI</p>
        <p th:if="${invalidCode}" role="alert" class="mt-4 text-danger" th:text="#{identity.mfa.invalid}">
            The code is invalid.
        </p>
        <form method="post" th:action="@{/cuenta/seguridad/mfa/enrolar}" class="mt-6 space-y-5">
            <div>
                <label for="mfa-enroll-code" th:text="#{identity.mfa.code}">Authentication code</label>
                <input id="mfa-enroll-code" name="code" required maxlength="6" pattern="[0-9]{6}"
                       autocomplete="one-time-code" inputmode="numeric"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            </div>
            <button type="submit" class="min-h-11 rounded bg-primary px-4 text-on-primary"
                    th:text="#{identity.mfa.enable}">Enable MFA</button>
        </form>
    </section>
</main>
</html>
