<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('identity.profile.title', ~{::main}, 'account')}">
<main id="main-content" class="mx-auto w-full max-w-2xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.profile.title}">Profile</h1>
        <p th:if="${saved}" role="status" class="mt-4 text-success" th:text="#{identity.profile.saved}">
            Changes saved.
        </p>
        <form method="post" th:action="@{/cuenta/perfil}" th:object="${form}" class="mt-6 space-y-5">
            <div>
                <label for="profile-email" th:text="#{identity.profile.email}">Email</label>
                <input id="profile-email" type="email" readonly th:value="${profile.email}"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            </div>
            <div>
                <label for="profile-name" th:text="#{identity.profile.name}">Display name</label>
                <input id="profile-name" th:field="*{displayName}" required maxlength="120" autocomplete="name"
                       th:attr="aria-describedby=${#fields.hasErrors('displayName') ? 'profile-name-error' : null}"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                <p id="profile-name-error" th:if="${#fields.hasErrors('displayName')}" role="alert"
                   class="mt-1 text-danger" th:errors="*{displayName}">Invalid name</p>
            </div>
            <div>
                <label for="profile-locale" th:text="#{identity.profile.locale}">Language</label>
                <select id="profile-locale" th:field="*{locale}"
                        class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div>
                <label for="profile-theme" th:text="#{identity.profile.theme}">Theme</label>
                <select id="profile-theme" th:field="*{theme}"
                        class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                    <option value="light" th:text="#{nav.theme.light}">Light</option>
                    <option value="dark" th:text="#{nav.theme.dark}">Dark</option>
                </select>
            </div>
            <p class="rounded border border-border p-3 text-sm text-muted"
               th:text="#{identity.profile.external-password}">
                This password is separate from SimbioSphere.
            </p>
            <button type="submit" class="min-h-11 rounded bg-primary px-4 text-on-primary"
                    th:text="#{identity.profile.save}">Save changes</button>
        </form>
        <a class="mt-5 inline-flex min-h-11 items-center text-primary"
           th:href="@{/cuenta/seguridad/password}" th:text="#{identity.profile.change-password}">
            Change password
        </a>
    </section>
</main>
</html>
