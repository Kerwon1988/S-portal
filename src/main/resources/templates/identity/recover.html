<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('identity.recovery.title', ~{::main}, 'account')}">
<main id="main-content" class="mx-auto w-full max-w-xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.recovery.heading}">Recover access</h1>
        <p class="mt-3 text-muted" th:text="#{identity.recovery.description}">Enter your email.</p>
        <form method="post" th:action="@{/recuperar}" class="mt-6 space-y-5">
            <div>
                <label for="recovery-email" th:text="#{identity.recovery.email}">Email</label>
                <input id="recovery-email" name="email" type="email" required maxlength="320" autocomplete="email"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            </div>
            <button type="submit" class="min-h-11 rounded bg-primary px-4 text-on-primary"
                    th:text="#{identity.recovery.submit}">Send instructions</button>
        </form>
    </section>
</main>
</html>
