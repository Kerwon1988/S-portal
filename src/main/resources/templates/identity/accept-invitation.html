<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('identity.invitation.title', ~{::main}, 'account')}">
<main id="main-content" class="mx-auto w-full max-w-xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.invitation.heading}">Accept invitation</h1>
        <p class="mt-3 text-muted" th:text="#{identity.invitation.description}">Set your own password.</p>
        <form method="post" th:action="@{/invitacion/aceptar}" class="mt-6 space-y-5">
            <input type="hidden" name="token" th:value="${token}">
            <div>
                <label for="display-name" th:text="#{identity.profile.name}">Display name</label>
                <input id="display-name" name="displayName" required maxlength="120" autocomplete="name"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            </div>
            <div>
                <label for="invite-password" th:text="#{identity.reset.password}">Password</label>
                <input id="invite-password" name="newPassword" type="password" required minlength="12" maxlength="64"
                       autocomplete="new-password"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            </div>
            <label class="flex min-h-11 items-center gap-2">
                <input name="termsAccepted" type="checkbox" value="true" required>
                <span>
                    <span th:text="#{identity.invitation.terms}">I accept the applicable terms.</span>
                    <a th:href="@{/{lang}/legal/terminos(lang=${locale})}" class="underline"
                       th:text="#{identity.invitation.terms-link}">Read terms</a>
                </span>
            </label>
            <label class="flex min-h-11 items-center gap-2">
                <input name="privacyAccepted" type="checkbox" value="true" required>
                <span>
                    <span th:text="#{identity.invitation.privacy}">I acknowledge the privacy notice.</span>
                    <a th:href="@{/{lang}/legal/privacidad(lang=${locale})}" class="underline"
                       th:text="#{identity.invitation.privacy-link}">Read privacy notice</a>
                </span>
            </label>
            <button type="submit" class="min-h-11 rounded bg-primary px-4 text-on-primary"
                    th:text="#{identity.invitation.submit}">Activate account</button>
        </form>
    </section>
</main>
</html>
