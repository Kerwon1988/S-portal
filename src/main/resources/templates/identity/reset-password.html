<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('identity.reset.title', ~{::main}, 'account')}">
<main id="main-content" class="mx-auto w-full max-w-xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{identity.reset.heading}">Set a new password</h1>
        <form method="post" th:action="@{/restablecer}" class="mt-6 space-y-5">
            <input type="hidden" name="token" th:value="${token}">
            <div>
                <label for="new-password" th:text="#{identity.reset.password}">New password</label>
                <input id="new-password" name="newPassword" type="password" required minlength="12" maxlength="64"
                       autocomplete="new-password"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            </div>
            <p class="text-sm text-muted" th:text="#{identity.reset.policy}">Use 12 to 64 characters.</p>
            <button type="submit" class="min-h-11 rounded bg-primary px-4 text-on-primary"
                    th:text="#{identity.reset.submit}">Update password</button>
        </form>
    </section>
</main>
</html>
