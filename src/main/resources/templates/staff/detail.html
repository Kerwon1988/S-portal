<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/backoffice :: layout(~{::main})}">
<main id="main-content" class="mx-auto w-full max-w-3xl px-4 py-8" tabindex="-1">
    <a th:href="@{/gestion/trabajadores}" class="underline" th:text="#{staff.detail.back}">Back to workers</a>
    <section class="mt-5 rounded-xl border border-border bg-surface p-6">
        <h1 class="font-heading text-3xl" th:text="${identity.displayName}">Worker</h1>
        <p class="mt-2" th:text="${identity.email}">worker@example.test</p>
        <p th:if="${saved}" role="status" class="mt-4" th:text="#{staff.detail.saved}">Changes saved.</p>
        <form method="post" th:action="@{/gestion/trabajadores/{id}(id=${identity.publicId})}"
              th:object="${form}" class="mt-6 space-y-5">
            <div>
                <label for="job-title" th:text="#{staff.detail.job-title}">Job title</label>
                <input id="job-title" name="jobTitle" type="text" maxlength="120" th:value="${form.jobTitle}"
                       th:attr="aria-invalid=${#fields.hasErrors('jobTitle')} ? 'true' : null,aria-describedby=${#fields.hasErrors('jobTitle')} ? 'job-title-error' : null"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                <p id="job-title-error" th:if="${#fields.hasErrors('jobTitle')}"
                   th:errors="*{jobTitle}" role="alert" class="mt-1 text-danger">Invalid job title</p>
            </div>
            <div>
                <label for="worker-status" th:text="#{staff.detail.status}">Status</label>
                <select id="worker-status" name="status" required
                        th:attr="aria-invalid=${#fields.hasErrors('status')} ? 'true' : null,aria-describedby=${#fields.hasErrors('status')} ? 'worker-status-error' : null"
                        class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                    <option value="ACTIVE" th:selected="${form.status == 'ACTIVE'}" th:text="#{staff.detail.active}">Active</option>
                    <option value="INACTIVE" th:selected="${form.status == 'INACTIVE'}" th:text="#{staff.detail.inactive}">Inactive</option>
                </select>
                <p id="worker-status-error" th:if="${#fields.hasErrors('status')}"
                   th:errors="*{status}" role="alert" class="mt-1 text-danger">Invalid status</p>
            </div>
            <div>
                <label for="specialties" th:text="#{staff.detail.specialties}">Specialties</label>
                <textarea id="specialties" name="specialties" rows="5" maxlength="1638" th:field="*{specialties}"
                          th:attr="aria-invalid=${#fields.hasErrors('specialties')} ? 'true' : null,aria-describedby=${#fields.hasErrors('specialties')} ? 'specialties-help specialties-error' : 'specialties-help'"
                          class="mt-1 w-full rounded border border-border bg-surface px-3 py-2"></textarea>
                <p id="specialties-help" class="mt-1 text-text-muted" th:text="#{staff.detail.specialties-help}">
                    Enter up to 20 specialties, one per line; each can contain up to 80 characters.
                </p>
                <p id="specialties-error" th:if="${#fields.hasErrors('specialties')}"
                   th:errors="*{specialties}" role="alert" class="mt-1 text-danger">Invalid specialties</p>
            </div>
            <button type="submit" class="min-h-11 rounded bg-primary px-4 text-on-primary"
                    th:text="#{staff.detail.save}">Save worker</button>
        </form>
        <dl class="mt-6 grid gap-3 border-t border-border pt-5 sm:grid-cols-2">
            <div>
                <dt class="font-semibold" th:text="#{staff.detail.start-date}">Employment start date</dt>
                <dd th:text="${profile.employmentStartDate}">2026-01-01</dd>
            </div>
            <div>
                <dt class="font-semibold" th:text="#{staff.detail.created}">Profile created</dt>
                <dd th:text="${profile.createdAt}">date</dd>
            </div>
        </dl>
    </section>
</main>
</html>
