<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/backoffice :: layout(~{::main})}">
<main id="main-content" class="mx-auto w-full max-w-2xl px-4 py-8" tabindex="-1">
    <h1 class="font-heading text-3xl" th:text="#{staff.invitation.title}">Invite a worker</h1>
    <p th:if="${sent}" role="status" class="mt-4" th:text="#{staff.invitation.sent}">
        If the invitation can be processed, it will be sent.
    </p>
    <p th:if="${sent == false}" role="status" class="mt-4" th:text="#{staff.invitation.generic}">
        The invitation could not be sent.
    </p>
    <form method="post" th:action="@{/gestion/trabajadores/invitacion}"
          th:object="${form}" class="mt-6 space-y-5 rounded-xl border border-border bg-surface p-6">
        <div>
            <label for="worker-email" th:text="#{staff.invitation.email}">Worker email</label>
            <input id="worker-email" name="email" type="email" required maxlength="320" autocomplete="email"
                   th:value="${form.email}"
                   class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" role="alert"
               class="mt-1 text-danger">Invalid email</p>
        </div>
        <button type="submit" class="min-h-11 rounded bg-primary px-4 text-on-primary"
                th:text="#{staff.invitation.submit}">Send invitation</button>
    </form>
    <a th:href="@{/gestion/identidad/invitaciones/pendientes/trabajadores}"
       class="mt-5 inline-block underline" th:text="#{staff.invitation.pending-link}">
        Manage pending invitations
    </a>
</main>
</html>
