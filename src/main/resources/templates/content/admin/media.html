<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/backoffice :: layout(~{::main})}">
<main id="main-content" class="mx-auto w-full max-w-5xl px-4 py-10" tabindex="-1">
    <h1 class="mb-6 font-heading text-3xl" th:text="#{content.media.title}">Media library</h1>
    <p th:if="${noticeKey}" class="mb-4 text-success" role="status" th:text="#{${noticeKey}}"></p>
    <p th:if="${errorKey}" class="mb-4 text-danger" role="alert" th:text="#{${errorKey}}"></p>
    <form method="post" enctype="multipart/form-data" class="grid gap-4 rounded-xl border border-border bg-surface p-5">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label class="grid gap-2" for="media-file">
            <span th:text="#{content.media.file}">Image file</span>
            <input id="media-file" type="file" name="file" accept="image/jpeg,image/png,image/webp" required>
        </label>
        <label class="grid gap-2" for="alt-es">
            <span th:text="#{content.media.alt.es}">Alternative text in Spanish</span>
            <input id="alt-es" class="min-h-11 rounded border border-border bg-surface px-3"
                   name="altEs" maxlength="500" required>
        </label>
        <label class="grid gap-2" for="alt-en">
            <span th:text="#{content.media.alt.en}">Alternative text in English</span>
            <input id="alt-en" class="min-h-11 rounded border border-border bg-surface px-3"
                   name="altEn" maxlength="500" required>
        </label>
        <button class="min-h-11 rounded bg-primary px-5 text-on-primary" type="submit"
                th:text="#{content.media.upload}">Upload and scan</button>
    </form>
    <ul class="mt-6 grid gap-3 sm:grid-cols-2">
        <li th:each="asset : ${media}" class="rounded border border-border bg-surface p-4">
            <img class="mb-3 h-48 w-full rounded object-contain"
                 th:src="@{/gestion/contenido/medios/{publicId}/preview(publicId=${asset.filePublicId})}"
                 alt="" loading="lazy">
            <p class="break-all" th:text="${asset.filePublicId}">Media ID</p>
            <p class="mt-2" th:text="${asset.altEs}">Spanish alt</p>
            <p th:text="${asset.altEn}">English alt</p>
        </li>
    </ul>
</main>
</html>
