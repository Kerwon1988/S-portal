<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/backoffice :: layout(~{::main})}">
<main id="main-content" class="mx-auto w-full max-w-5xl px-4 py-10" tabindex="-1">
    <h1 class="mb-4 font-heading text-3xl" th:text="#{content.legal.title}">Legal documents</h1>
    <p th:if="${noticeKey}" class="mb-4 text-success" role="status" th:text="#{${noticeKey}}"></p>
    <p class="mb-6 rounded border border-warning p-4 text-text"
       role="status" th:text="#{content.legal.pending}">Legal texts remain drafts until approved.</p>
    <form method="post" class="grid gap-4 rounded-xl border border-border bg-surface p-5">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label class="grid gap-2" for="legal-type">
            <span th:text="#{content.legal.type}">Document type</span>
            <select id="legal-type" class="min-h-11 rounded border border-border bg-surface px-3" name="documentType">
                <option value="NOTICE">Legal notice</option>
                <option value="PRIVACY">Privacy</option>
                <option value="COOKIES">Cookies</option>
                <option value="TERMS">Terms</option>
            </select>
        </label>
        <label class="grid gap-2" for="legal-locale">
            <span th:text="#{content.locale}">Language</span>
            <select id="legal-locale" class="min-h-11 rounded border border-border bg-surface px-3" name="locale">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </label>
        <label class="grid gap-2" for="legal-title">
            <span th:text="#{content.title}">Title</span>
            <input id="legal-title" class="min-h-11 rounded border border-border bg-surface px-3"
                   name="title" maxlength="200" required>
        </label>
        <label class="grid gap-2" for="legal-effective-date">
            <span th:text="#{content.legal.effective-date}">Effective date (Europe/Madrid)</span>
            <input id="legal-effective-date" class="min-h-11 rounded border border-border bg-surface px-3"
                   name="effectiveDate" type="date">
            <span class="text-text-muted" th:text="#{content.legal.effective-date.help}">
                Leave blank for immediate effect after approval.
            </span>
        </label>
        <label class="grid gap-2" for="legal-body">
            <span th:text="#{content.legal.body}">Legal text in Markdown</span>
            <textarea id="legal-body" class="min-h-48 rounded border border-border bg-surface p-3"
                      name="contentMarkdown" maxlength="16000" required></textarea>
        </label>
        <button class="min-h-11 rounded bg-primary px-5 text-on-primary" type="submit"
                th:text="#{content.action.save}">Save draft</button>
    </form>
    <ul class="mt-6 space-y-3">
        <li th:each="document : ${documents}" class="rounded border border-border bg-surface p-4">
            <span th:text="${document.documentType + ' / ' + document.locale + ' / v' + document.version}">PRIVACY / es / v1</span>
            <span class="ml-2 text-warning" th:text="${document.approvalState}">PENDING</span>
            <p class="mt-2" th:text="${document.title}">Title</p>
            <p th:if="${document.effectiveFrom != null}" class="mt-2 text-text-muted">
                <span th:text="#{content.legal.effective-date.utc}">Effective from (UTC):</span>
                <time th:datetime="${document.effectiveFrom}" th:text="${document.effectiveFrom}">2030-01-01T00:00:00Z</time>
            </p>
        </li>
    </ul>
</main>
</html>
