<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/public :: layout(~{::main})}">
<main id="main-content" class="mx-auto w-full max-w-4xl px-4 py-10" tabindex="-1">
    <article class="rounded-xl bg-surface p-6 sm:p-10">
        <h1 class="font-heading text-3xl" th:text="${document.title}">Legal document</h1>
        <div class="mt-6 space-y-3 text-text-muted" th:utext="${document.body.value}">
            Approved legal document text
        </div>
    </article>
</main>
</html>
