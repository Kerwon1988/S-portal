<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('customer.registration.title', ~{::main}, 'public')}">
<main id="main-content" class="mx-auto w-full max-w-2xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{customer.registration.heading}">Create a customer account</h1>
        <p th:if="${legalUpdated}" class="mt-4 rounded border border-warning p-3" role="status"
           th:text="#{customer.registration.legal.updated}">The legal documents changed. Review them and submit again.</p>
        <p th:unless="${registrationAvailable}" class="mt-4 rounded border border-danger p-3" role="alert"
           th:text="#{customer.registration.unavailable}">Registration is temporarily unavailable.</p>
        <div th:if="${registrationAvailable}">
            <form method="post" th:action="@{/registro}" th:object="${registrationForm}"
                  class="mt-6 space-y-5" data-anti-bot
                  th:attr="data-challenge-url=@{/anti-bot/challenge}">
                <p th:if="${#fields.hasGlobalErrors()}" class="rounded border border-danger p-3 text-danger"
                   role="alert" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                <input type="hidden" th:field="*{termsVersion}">
                <input type="hidden" th:field="*{privacyVersion}">
                <input type="hidden" th:field="*{marketingVersion}">
                <div>
                    <label for="registration-email" class="block font-medium"
                           th:text="#{customer.registration.email}">Email</label>
                    <input id="registration-email" type="email" autocomplete="email" required maxlength="320"
                           th:field="*{email}" aria-describedby="registration-email-error"
                           class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                    <p id="registration-email-error" class="mt-1 text-sm text-danger" role="alert"
                       th:errors="*{email}"></p>
                </div>
                <div>
                    <label for="registration-password" class="block font-medium"
                           th:text="#{customer.registration.password}">Password</label>
                    <input id="registration-password" name="password" type="password" autocomplete="new-password"
                           required minlength="12" maxlength="64" aria-describedby="registration-password-help"
                           class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                    <p id="registration-password-help" class="mt-1 text-sm text-muted"
                       th:text="#{customer.registration.password-policy}">Use 12 to 64 characters.</p>
                    <p class="mt-1 text-sm text-danger" role="alert" th:errors="*{password}"></p>
                </div>
                <div>
                    <label for="person-name" class="block font-medium"
                           th:text="#{customer.registration.person-name}">Your name</label>
                    <input id="person-name" type="text" autocomplete="name" required maxlength="120"
                           th:field="*{personName}" aria-describedby="person-name-error"
                           class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                    <p id="person-name-error" class="mt-1 text-sm text-danger" role="alert"
                       th:errors="*{personName}"></p>
                </div>
                <div>
                    <label for="account-type" class="block font-medium"
                           th:text="#{customer.registration.account-type}">Account type</label>
                    <select id="account-type" th:field="*{accountType}" required
                            class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                        <option value="INDIVIDUAL" th:text="#{customer.registration.individual}">Individual</option>
                        <option value="COMPANY" th:text="#{customer.registration.company}">Company</option>
                        <option value="SOLE_TRADER" th:text="#{customer.registration.sole-trader}">Sole trader</option>
                    </select>
                    <p class="mt-1 text-sm text-danger" role="alert" th:errors="*{accountType}"></p>
                </div>
                <div>
                    <label for="account-name" class="block font-medium"
                           th:text="#{customer.registration.account-name}">Account name</label>
                    <input id="account-name" type="text" maxlength="160" th:field="*{accountName}"
                           aria-describedby="account-name-help account-name-error"
                           class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                    <p id="account-name-help" class="mt-1 text-sm text-muted"
                       th:text="#{customer.registration.account-name-help}">For individuals, leave blank to use your name.</p>
                    <p id="account-name-error" class="mt-1 text-sm text-danger" role="alert"
                       th:errors="*{accountName}"></p>
                </div>
                <div>
                    <label for="phone-number" class="block font-medium"
                           th:text="#{customer.registration.phone}">Phone (optional)</label>
                    <input id="phone-number" type="tel" autocomplete="tel" maxlength="16"
                           placeholder="+34123456789" th:field="*{phoneNumber}"
                           aria-describedby="phone-number-error"
                           class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                    <p id="phone-number-error" class="mt-1 text-sm text-danger" role="alert"
                       th:errors="*{phoneNumber}"></p>
                </div>
                <div>
                    <label for="country-code" class="block font-medium"
                           th:text="#{customer.registration.country}">Tax country</label>
                    <select id="country-code" th:field="*{countryCode}"
                            class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                        <option value="ES" th:text="#{customer.registration.spain}">Spain</option>
                    </select>
                </div>
                <div>
                    <label for="tax-identifier" class="block font-medium"
                           th:text="#{customer.registration.tax-id}">NIF/CIF/NIE (optional)</label>
                    <input id="tax-identifier" type="text" maxlength="32" th:field="*{taxIdentifier}"
                           aria-describedby="tax-identifier-help tax-identifier-error"
                           class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                    <p id="tax-identifier-help" class="mt-1 text-sm text-muted"
                       th:text="#{customer.registration.tax-id-help}">Only Spanish tax identifiers are supported.</p>
                    <p id="tax-identifier-error" class="mt-1 text-sm text-danger" role="alert"
                       th:errors="*{taxIdentifier}"></p>
                </div>
                <fieldset class="space-y-3">
                    <legend class="font-medium" th:text="#{customer.registration.legal-heading}">Legal terms</legend>
                    <label class="flex min-h-11 items-start gap-2">
                        <input type="checkbox" required th:field="*{termsAccepted}" aria-describedby="terms-error">
                        <span>
                            <span th:text="#{customer.registration.accept-terms}">I accept the terms.</span>
                            <a class="text-primary underline"
                               th:href="@{/{lang}/legal/terms(lang=${formLocale})}"
                               th:text="#{customer.registration.terms-link}">Read terms</a>
                        </span>
                    </label>
                    <p id="terms-error" class="text-sm text-danger" role="alert" th:errors="*{termsAccepted}"></p>
                    <label class="flex min-h-11 items-start gap-2">
                        <input type="checkbox" required th:field="*{privacyAccepted}" aria-describedby="privacy-error">
                        <span>
                            <span th:text="#{customer.registration.accept-privacy}">I acknowledge the privacy notice.</span>
                            <a class="text-primary underline"
                               th:href="@{/{lang}/legal/privacy(lang=${formLocale})}"
                               th:text="#{customer.registration.privacy-link}">Read privacy notice</a>
                        </span>
                    </label>
                    <p id="privacy-error" class="text-sm text-danger" role="alert" th:errors="*{privacyAccepted}"></p>
                    <label th:if="${legalVersions != null and legalVersions.hasMarketingDocument()}"
                           class="flex min-h-11 items-start gap-2">
                        <input type="checkbox" th:field="*{marketingAccepted}">
                        <span th:text="#{customer.registration.marketing}">
                            I agree to receive optional commercial communications.
                        </span>
                    </label>
                </fieldset>
                <div th:replace="~{fragments/anti-bot :: challenge(${challenge})}"></div>
                <button type="submit"
                        class="inline-flex min-h-11 w-full items-center justify-center rounded bg-primary px-4 text-on-primary"
                        th:text="#{customer.registration.submit}">Create account</button>
            </form>
        </div>
    </section>
</main>
</html>
