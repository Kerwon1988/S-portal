<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/backoffice :: layout(~{::main})}">
<main id="main-content" class="mx-auto w-full max-w-2xl px-4 py-10" tabindex="-1">
    <section class="rounded-xl border border-border bg-surface p-6 sm:p-8">
        <h1 class="font-heading text-3xl" th:text="#{customer.invitation.heading}">Invite a customer</h1>
        <p th:if="${submitted}" class="mt-4 rounded border border-border p-3" role="status"
           th:text="#{customer.invitation.submitted}">
            If the invitation can be processed, it will be sent to the address provided.
        </p>
        <form method="post" th:action="@{/gestion/clientes/nuevo}" th:object="${invitationForm}"
              class="mt-6 space-y-5">
            <div>
                <label for="customer-invite-email" class="block font-medium"
                       th:text="#{customer.invitation.email}">Email address</label>
                <input id="customer-invite-email" type="email" autocomplete="email" required maxlength="320"
                       th:field="*{email}" aria-describedby="customer-invite-email-error"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                <p id="customer-invite-email-error" class="mt-1 text-sm text-danger" role="alert"
                   th:errors="*{email}"></p>
            </div>
            <div>
                <label for="customer-invite-type" class="block font-medium"
                       th:text="#{customer.invitation.account-type}">Account type</label>
                <select id="customer-invite-type" th:field="*{accountType}" required
                        class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                    <option value="INDIVIDUAL" th:text="#{customer.registration.individual}">Individual</option>
                    <option value="COMPANY" th:text="#{customer.registration.company}">Company</option>
                    <option value="SOLE_TRADER" th:text="#{customer.registration.sole-trader}">Sole trader</option>
                </select>
                <p class="mt-1 text-sm text-danger" role="alert" th:errors="*{accountType}"></p>
            </div>
            <div>
                <label for="customer-invite-name" class="block font-medium"
                       th:text="#{customer.invitation.account-name}">Account name</label>
                <input id="customer-invite-name" type="text" required maxlength="160" th:field="*{accountName}"
                       aria-describedby="customer-invite-name-error"
                       class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
                <p id="customer-invite-name-error" class="mt-1 text-sm text-danger" role="alert"
                   th:errors="*{accountName}"></p>
            </div>
            <button type="submit"
                    class="inline-flex min-h-11 w-full items-center justify-center rounded bg-primary px-4 text-on-primary"
                    th:text="#{customer.invitation.submit}">Send invitation</button>
        </form>
        <a th:href="@{/gestion/identidad/invitaciones/pendientes/clientes}"
           class="mt-5 inline-block underline" th:text="#{customer.invitation.pending-link}">
            Manage pending invitations
        </a>
    </section>
</main>
</html>
