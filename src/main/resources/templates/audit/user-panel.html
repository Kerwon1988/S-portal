<section xmlns:th="http://www.thymeleaf.org" th:fragment="panel"
         class="rounded-xl border border-border bg-surface p-4">
    <h3 class="font-semibold" th:text="#{audit.user-panel.heading}">User audit history</h3>
    <p th:if="${#lists.isEmpty(entityHistory)}" class="mt-2 text-text-muted"
       th:text="#{audit.user-panel.empty}">No audit events are available.</p>
    <ul th:unless="${#lists.isEmpty(entityHistory)}" class="mt-3 space-y-2">
        <li th:each="event : ${entityHistory}" class="grid gap-1 border-b border-border py-2 sm:grid-cols-3">
            <time th:datetime="${event.occurredAt}" th:text="${event.occurredAt}">Time</time>
            <span th:text="${event.actionCode}">Action</span>
            <span th:text="${event.actorId}">Actor</span>
        </li>
    </ul>
</section>
