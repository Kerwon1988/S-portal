<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/account :: layout(~{::main})}">
<main id="main-content" class="mx-auto w-full max-w-3xl px-4 py-8" tabindex="-1">
    <h1 class="font-heading text-3xl" th:text="${suggestion} ? #{request.new.suggestion} : #{request.new.custom}">New request</h1>
    <form method="post" th:action="${suggestion} ? @{/cuenta/solicitudes/sugerencia} : @{/cuenta/solicitudes/nueva}"
          th:object="${requestForm}" class="mt-6 space-y-5">
        <div>
            <label for="category" th:text="#{request.category}">Category</label>
            <select id="category" th:field="*{category}" class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3" required>
                <option value="WEB_APPLICATION">Web application</option>
                <option value="INTEGRATION">Integration</option>
                <option value="AUTOMATION">Automation</option>
                <option value="CONSULTING">Consulting</option>
                <option th:if="${suggestion}" value="SIMBIOSPHERE_MODULE">SimbioSphere module</option>
            </select>
            <p class="text-sm text-danger" role="alert" th:errors="*{category}"></p>
        </div>
        <div><label for="title" th:text="#{request.form.title}">Title</label>
            <input id="title" th:field="*{title}" maxlength="160" required class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            <p class="text-sm text-danger" role="alert" th:errors="*{title}"></p></div>
        <div><label for="description" th:text="#{request.description}">Description</label>
            <textarea id="description" th:field="*{description}" rows="7" maxlength="10000" required class="mt-1 w-full rounded border border-border bg-surface px-3 py-2"></textarea>
            <p class="text-sm text-danger" role="alert" th:errors="*{description}"></p></div>
        <div th:unless="${suggestion}"><label for="objective" th:text="#{request.objective}">Objective</label>
            <textarea id="objective" th:field="*{objective}" rows="3" maxlength="2000" class="mt-1 w-full rounded border border-border bg-surface px-3 py-2"></textarea></div>
        <div th:if="${suggestion}"><label for="relatedModule" th:text="#{request.module}">Related module</label>
            <input id="relatedModule" th:field="*{relatedModule}" maxlength="80" pattern="[A-Za-z0-9_-]{1,80}" required class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3">
            <label for="impact" class="mt-4 block" th:text="#{request.impact}">Impact</label>
            <textarea id="impact" th:field="*{impact}" rows="4" maxlength="4000" required class="mt-1 w-full rounded border border-border bg-surface px-3 py-2"></textarea></div>
        <div th:unless="${suggestion}" class="grid gap-4 sm:grid-cols-2">
            <div><label for="estimatedBudget" th:text="#{request.budget}">Estimated budget</label>
                <input id="estimatedBudget" th:field="*{estimatedBudget}" type="number" min="0" step="0.01" class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3"></div>
            <div><label for="targetDate" th:text="#{request.target-date}">Target date</label>
                <input id="targetDate" th:field="*{targetDate}" type="date" class="mt-1 min-h-11 w-full rounded border border-border bg-surface px-3"></div>
        </div>
        <p class="text-sm text-muted" th:text="#{request.pricing-warning}">Estimates are not an approved quote.</p>
        <button type="submit" class="min-h-11 rounded bg-primary px-5 py-2 text-white" th:text="#{request.submit}">Submit</button>
    </form>
</main>
</html>
