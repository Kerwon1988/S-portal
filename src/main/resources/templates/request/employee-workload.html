<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: layout('employee.workload.title', ~{::main}, 'backoffice')}">
<main id="main-content" class="mx-auto w-full max-w-5xl space-y-6 p-4 sm:p-6" tabindex="-1">
    <header><a href="/gestion" class="underline" th:text="#{employee.back}">Back</a><h1 class="mt-3 font-heading text-3xl" th:text="#{employee.workload.heading}">Workload</h1><p class="mt-2 text-text-muted" th:text="#{employee.sla.pending}">Provisional SLA.</p></header>
    <form method="get" class="flex gap-3"><label for="staffFilter" class="sr-only" th:text="#{employee.search-staff}">Search staff</label><input id="staffFilter" name="staffFilter" type="search" class="min-h-11 flex-1 rounded border border-border bg-surface px-3"><button class="min-h-11 rounded bg-accent px-4 text-on-accent" th:text="#{request.filter}">Filter</button></form>
    <div class="overflow-x-auto"><table class="w-full border-collapse"><caption class="sr-only" th:text="#{employee.workload.heading}">Workload</caption><thead><tr class="border-b border-border"><th class="p-3 text-left" th:text="#{employee.worker}">Worker</th><th class="p-3 text-left" th:text="#{employee.open-assignments}">Open</th><th class="p-3 text-left" th:text="#{employee.overdue}">Overdue</th></tr></thead><tbody><tr th:each="row : ${workload}" class="border-b border-border"><th scope="row" class="p-3" th:text="${row.jobTitle == null ? row.staffUserId : row.jobTitle}">Worker</th><td class="p-3" th:text="${row.openAssignments}">0</td><td class="p-3" th:text="${row.overdue}">0</td></tr></tbody></table></div>
</main>
</html>
