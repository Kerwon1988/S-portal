<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/account :: layout(~{::main})}">
<main id="main-content" class="mx-auto w-full max-w-4xl px-4 py-8 space-y-8" tabindex="-1">
    <header><a th:href="@{/cuenta/solicitudes}" class="underline" th:text="#{request.back}">Back</a>
        <h1 class="mt-3 font-heading text-3xl" th:text="${request.summary.reference} + ' · ' + ${request.summary.title}">Request</h1>
        <p class="mt-2" th:text="#{|request.status.${request.summary.status}|}"></p>
        <p th:if="${request.decisionReason}" class="mt-2"><strong th:text="#{request.decision}">Decision</strong>: <span th:text="${request.decisionReason}"></span></p>
        <p th:if="${request.duplicateReference}" class="mt-2"><strong th:text="#{request.original-request}">Original request</strong>: <span th:text="${request.duplicateReference}"></span></p></header>
    <section class="rounded border border-border bg-surface p-5"><h2 class="text-xl font-semibold" th:text="#{request.description}">Description</h2><p class="mt-3 whitespace-pre-wrap" th:text="${request.description}"></p><p th:if="${request.objective}" class="mt-3"><strong th:text="#{request.objective}">Objective</strong>: <span th:text="${request.objective}"></span></p></section>
    <section><h2 class="text-xl font-semibold" th:text="#{quote.heading}">Quote</h2><p class="mt-2 text-sm text-muted" th:text="#{quote.provisional}">Provisional.</p><article th:each="quote : ${quotes}" class="mt-4 rounded border border-border bg-surface p-5"><dl class="grid grid-cols-2 gap-3"><dt th:text="#{quote.version}">Version</dt><dd th:text="${quote.versionNumber}"></dd><dt th:text="#{quote.status}">Status</dt><dd th:text="#{|quote.status.${quote.status}|}"></dd><dt th:text="#{quote.net}">Net</dt><dd th:text="${quote.netAmount} + ' ' + ${quote.currency}"></dd><dt th:text="#{quote.tax}">Tax</dt><dd th:text="${quote.taxRate == null ? #messages.msg('quote.pending') : quote.taxRate + '%'}"></dd><dt th:text="#{quote.gross}">Total</dt><dd th:text="${quote.grossAmount} + ' ' + ${quote.currency}"></dd><dt th:text="#{quote.valid-until}">Valid until</dt><dd th:text="${quote.validUntil == null ? #messages.msg('quote.pending') : quote.validUntil}"></dd></dl><form th:if="${quote.status.name() == 'SENT'}" method="post" th:action="@{/cuenta/solicitudes/{id}/presupuesto/{version}/decision(id=${request.summary.publicId},version=${quote.versionNumber})}" class="mt-4 space-y-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="flex min-h-11 items-center gap-3"><input type="checkbox" required><span th:text="#{quote.confirm-review}">I have reviewed it.</span></label><div class="flex flex-wrap gap-3"><button name="decision" value="ACCEPTED" class="min-h-11 rounded bg-primary px-4 text-white" th:text="#{quote.accept}">Accept</button><button name="decision" value="REJECTED" class="min-h-11 rounded border border-danger px-4 text-danger" th:text="#{quote.reject}">Reject</button></div></form></article></section>
    <section><h2 class="text-xl font-semibold" th:text="#{request.timeline}">Public history</h2><ol class="mt-3 space-y-3"><li th:each="event : ${request.history}" class="border-l-2 border-border pl-4"><strong th:text="#{|request.status.${event.toStatus}|}"></strong><p class="text-sm text-muted" th:text="${#temporals.format(event.createdAt, 'yyyy-MM-dd HH:mm')}" ></p></li></ol></section>
    <section><h2 class="text-xl font-semibold" th:text="#{request.messages}">Messages</h2><p th:if="${conversation == null || conversation.messages.empty}" class="mt-2 text-muted" th:text="#{request.no-messages}">No messages</p><ol th:if="${conversation != null}" class="mt-3 space-y-3"><li th:each="message : ${conversation.messages}" class="rounded border border-border p-3"><p class="whitespace-pre-wrap" th:text="${message.body}"></p><ul th:if="${!message.attachments.empty}" class="mt-2 flex flex-wrap gap-2"><li th:each="attachment : ${message.attachments}"><a th:href="@{/cuenta/mensajes/{conversationId}/adjuntos/{fileId}(conversationId=${conversation.publicId},fileId=${attachment.publicId})}" class="text-accent-text underline" rel="nofollow" th:text="#{messaging.thread.attachment(${attachment.detectedMime},${attachment.sizeBytes})}">Attachment</a></li></ul></li></ol>
        <form method="post" th:action="@{/cuenta/solicitudes/{id}/mensaje(id=${request.summary.publicId})}" class="mt-4"><label for="message" th:text="#{request.add-information}">Add information</label><textarea id="message" name="body" rows="4" required maxlength="10000" class="mt-1 w-full rounded border border-border bg-surface p-3"></textarea><button class="mt-2 min-h-11 rounded bg-primary px-4 text-white" th:text="#{request.send}">Send</button></form></section>
    <section><h2 class="text-xl font-semibold" th:text="#{request.attachments}">Attachments</h2><ul class="mt-2"><li th:each="fileId : ${request.attachments}"><a th:href="@{/cuenta/solicitudes/{id}/adjuntos/{file}(id=${request.summary.publicId},file=${fileId})}" th:text="#{request.download-attachment}" class="underline"></a></li></ul>
        <form method="post" enctype="multipart/form-data" th:action="@{/cuenta/solicitudes/{id}/adjuntos(id=${request.summary.publicId})}" class="mt-3"><label for="attachment" th:text="#{request.attach}">Attach</label><input id="attachment" type="file" name="file" required class="block mt-1"><button class="mt-2 min-h-11 rounded border border-border px-4" th:text="#{request.upload}">Upload</button></form></section>
    <form method="post" th:action="@{/cuenta/solicitudes/{id}/cancelar(id=${request.summary.publicId})}" th:if="${request.summary.status.name() == 'RECIBIDA' or request.summary.status.name() == 'EN_ANALISIS' }"><button class="min-h-11 rounded border border-danger px-4 text-danger" th:text="#{request.cancel}">Cancel</button></form>
</main>
</html>
