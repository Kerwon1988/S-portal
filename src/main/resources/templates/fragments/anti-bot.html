<div xmlns:th="http://www.thymeleaf.org" th:fragment="challenge(challenge)">
    <label class="sr-only" for="website-address" th:text="#{identity.antibot.honeypot}">
        Leave this field empty
    </label>
    <input id="website-address" name="websiteAddress" type="text" tabindex="-1" autocomplete="off"
           class="absolute -left-[10000px] h-px w-px overflow-hidden" aria-hidden="true">
    <input type="hidden" name="altcha" value="">
    <input type="hidden" name="altchaFallback" th:value="${challenge.accessiblePayload()}">
    <p class="mt-2 text-sm text-muted" data-anti-bot-status role="status" aria-live="polite"
       th:text="#{identity.antibot.processing}">
        This form uses an automatic, accessible protection check.
    </p>
    <label class="mt-3 flex min-h-11 items-center gap-2">
        <input type="checkbox" name="humanConfirmation" value="true">
        <span th:text="#{identity.antibot.fallback}">I am submitting this form myself.</span>
    </label>
    <p class="mt-2 text-sm text-danger" data-anti-bot-error role="alert" hidden
       tabindex="-1" th:text="#{identity.antibot.error}">
        The automatic check could not complete. Use the accessible alternative.
    </p>
    <script type="module" defer th:src="${assets['anti-bot.js']}" th:attr="nonce=${cspNonce}"></script>
</div>
