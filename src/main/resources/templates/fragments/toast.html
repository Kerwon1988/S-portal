<div xmlns:th="http://www.thymeleaf.org" th:fragment="toast(message)"
     class="flex items-center justify-between gap-4 rounded border border-border bg-surface p-4"
     role="status" aria-live="polite" data-toast>
    <p th:text="${message}">Notification</p>
    <button class="min-h-11 min-w-11 rounded px-3" type="button" data-dismiss-toast
            th:attr="aria-label=#{toast.dismiss}">×</button>
</div>
