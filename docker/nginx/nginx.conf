worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    log_format safe '$time_iso8601 status=$status method=$request_method uri=$uri request_time=$request_time upstream_status=$upstream_status';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 25m;

    upstream portal_app { server portal:8090; }

    server {
        listen 80;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        location = /healthz { return 200; }

        location / {
            proxy_pass http://portal_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }
}
